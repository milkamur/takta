<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Настройки — JAX</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="account.css">
  <link rel="stylesheet" href="settings.css">
</head>

<body>

  <main class="settings-page">

  <header class="settings-top">

    <a href="account.html" class="settings-back jax-back">
      ←
    </a>
    
    <div
      class="settings-logo jax-logo"
      onclick="window.location.href='index.html'"
      role="link"
      tabindex="0"
    >
      JAX
    </div>
  
  </header>


    <section class="settings-header">
      <h1>ПРОФИЛЬ</h1>
    </section>


      <label class="settings-field">
        <span class="settings-field-label">
            Никнейм
          </span>

        <input
          type="text"
          id="profileNameInput"
          maxlength="24"
          placeholder="ИГРОК"
          autocomplete="name"
        >

      </label>

      <button
  class="settings-save"
  id="saveProfileNameBtn"
  type="button"
>
  СОХРАНИТЬ
</button>



    <section class="settings-section">

      <div class="settings-section-title">
        ПОДДЕРЖКА
      </div>

      <a
        href="support.html"
        class="settings-card"
      >

        <div>

          <div class="settings-card-title">
            ЧАТ С JAX
          </div>

          <div class="settings-card-subtitle">
            ВОПРОСЫ ПО ИГРАМ И ЗАКАЗАМ
          </div>

        </div>

        <span class="settings-card-arrow">
          →
        </span>

      </a>

    </section>


    <button
      class="settings-logout"
      id="settingsLogoutBtn"
      type="button"
    >
      ВЫЙТИ ИЗ АККАУНТА
    </button>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="settings.js"></script>

</body>

</html>
