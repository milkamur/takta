<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Бронирование — JAX</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="booking.css">
</head>

<body>

  <main class="booking-page">

    <a href="index.html" class="booking-back jax-back">
      ←
    </a>
  
    <div
      class="booking-logo jax-logo"
      onclick="window.location.href='index.html'"
      role="link"
      tabindex="0"
    >
      JAX
    </div>

    <section class="booking-box">

      <p class="booking-label">
        БЛИЖАЙШАЯ ИГРА
      </p>

      <h1 id="gameDate">
        —
      </h1>
      
      <div class="booking-info">

        <div class="booking-row">
          <span>СБОР ГОСТЕЙ</span>
          <strong id="gameTime">—</strong>
        </div>
      
        <div class="booking-row">
          <span>ОКОНЧАНИЕ</span>
          <strong id="gameEndTime">—</strong>
        </div>
      
        <div class="booking-row">
          <span>ЛОКАЦИЯ</span>
          <strong id="gameLocation">—</strong>
        </div>
      
        <div
          class="booking-location-details"
          id="gameLocationDetails"
        ></div>
      
        <div class="booking-row">
          <span>ФОРМАТ</span>
          <strong id="gameFormat">—</strong>
        </div>
      
        <div class="booking-row">
          <span>СТОИМОСТЬ</span>
          <strong id="gamePrice">—</strong>
        </div>

        <div class="booking-row booking-row-minimum">
          <span>
            МИНИМАЛЬНАЯ СУММА<br>
            ЗАКАЗА В РЕСТОРАНЕ
          </span>
          <strong>3 000 ₽</strong>
        </div>
      
      </div>

      <div class="booking-description">
        <p>
          Авторская психологическая игра JAX
          в закрытом формате.
        </p>
      </div>

      <p class="booking-description" style="margin-top: 24px; text-align: center; opacity: .85;">
        Онлайн-бронирование временно недоступно.
      </p>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="game-info.js"></script>

</body>
</html>
