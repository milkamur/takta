<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Бронирование — JAX</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="booking.css">
</head>

<body>

  <main class="booking-page">

    <a href="index.html" class="booking-back jax-back">
      ←
    </a>
  
    <div
      class="booking-logo jax-logo"
      onclick="window.location.href='index.html'"
      role="link"
      tabindex="0"
    >
      JAX
    </div>

    <section class="booking-box">

      <p class="booking-label">
        БЛИЖАЙШАЯ ИГРА
      </p>

      <h1 id="gameDate">
        —
      </h1>
      
      <div class="booking-info">

        <div class="booking-row">
          <span>СБОР ГОСТЕЙ</span>
          <strong id="gameTime">—</strong>
        </div>
      
        <div class="booking-row">
          <span>ОКОНЧАНИЕ</span>
          <strong id="gameEndTime">—</strong>
        </div>
      
        <div class="booking-row">
          <span>ЛОКАЦИЯ</span>
          <strong id="gameLocation">—</strong>
        </div>
      
        <div
          class="booking-location-details"
          id="gameLocationDetails"
        ></div>
      
        <div class="booking-row">
          <span>ФОРМАТ</span>
          <strong id="gameFormat">—</strong>
        </div>
      
        <div class="booking-row">
          <span>СТОИМОСТЬ</span>
          <strong id="gamePrice">—</strong>
        </div>

        <div class="booking-row booking-row-minimum">
          <span>
            МИНИМАЛЬНАЯ СУММА<br>
            ЗАКАЗА В РЕСТОРАНЕ
          </span>
          <strong>3 000 ₽</strong>
        </div>
      
      </div>

      <div class="booking-description">
        <p>
          Авторская психологическая игра JAX
          в закрытом формате.
        </p>
      </div>

      <button class="booking-button" id="bookingButton" type="button">
        <span>ЗАБРОНИРОВАТЬ</span>
        <span class="booking-arrow">→</span>
      </button>

      <div class="booking-form" id="bookingForm" hidden>

        <div class="booking-form-title">
          ДАННЫЕ ГОСТЯ
        </div>
      
        <label class="booking-field">
          <span>ИМЯ</span>
          <input
            type="text"
            id="guestName"
            autocomplete="name"
            placeholder="ВАШЕ ИМЯ"
          >
        </label>
      
        <label class="booking-field">
          <span>НОМЕР ТЕЛЕФОНА</span>
          <input
            type="tel"
            id="guestPhone"
            autocomplete="tel"
            inputmode="numeric"
            value="+7 "
          >
        </label>
      
        <label class="booking-field">
          <span>ПОЧТА</span>
          <input
            type="email"
            id="guestEmail"
            autocomplete="email"
            placeholder="EMAIL"
          >
        </label>
      
        <button
          class="booking-button booking-pay-button"
          id="bookingPayButton"
          type="button"
        >
          <span id="bookingPayText">
            ОПЛАТИТЬ
          </span>
      
          <span class="booking-arrow">→</span>
        </button>
      
      </div>

      <p class="booking-message" id="bookingMessage"></p>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="booking.js"></script>

</body>
</html>
