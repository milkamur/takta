<script>
const addButtons =
  document.querySelectorAll('.shop-add-button');

const cartCount =
  document.querySelector('.shop-cart-count');


function getCart() {
  return JSON.parse(
    localStorage.getItem('jaxCart')
  ) || [];
}


function saveCart(cart) {
  localStorage.setItem(
    'jaxCart',
    JSON.stringify(cart)
  );
}


function updateCartCount() {

  const cart = getCart();

  cartCount.textContent =
    cart.length;

}


function updateShopButtons() {

  const cart = getCart();

  document
    .querySelectorAll('.shop-product')
    .forEach(product => {

      const name =
        product.dataset.name;

      const button =
        product.querySelector('.shop-add-button');

      const buttonText =
        button.querySelector('span:first-child');

      const buttonIcon =
        button.querySelector('.shop-add-icon');

      const isAdded =
        cart.some(item => item.name === name);


      button.classList.toggle(
        'is-added',
        isAdded
      );


      if (isAdded) {

        buttonText.textContent =
          'ДОБАВЛЕНО';

        buttonIcon.textContent =
          '✓';

      } else {

        buttonText.textContent =
          'В КОРЗИНУ';

        buttonIcon.textContent =
          '+';

      }

    });

}


addButtons.forEach(button => {

button.addEventListener('click', event => {

  event.preventDefault();
  event.stopPropagation();

  const productId = Number(button.dataset.productId);
const name = button.dataset.product;
const price = Number(button.dataset.price);
const image = button.dataset.image;

  let cart = getCart();

  const exists = cart.some(
    item => item.name === name
  );

  if (exists) {

    cart = cart.filter(
      item => item.name !== name
    );

  } else {

    cart.push({
  productId,
  name,
  price,
  image
});

  }

  saveCart(cart);

  updateCartCount();
  updateShopButtons();
  updateFloatingCart();

});

});


updateCartCount();

updateShopButtons();
  

    const lionCard = document.querySelector(
  '.shop-product[data-name="Лев"]'
);

lionCard.addEventListener('click', (event) => {

  // Если нажали на "В КОРЗИНУ" — страницу товара не открываем
  if (event.target.closest('.shop-add-button')) {
    return;
  }

  window.location.href = 'lion.html';

});

const lionSlider = document.querySelector(
  '.shop-product[data-name="Лев"] .shop-product-slides'
);

const lionDots = document.querySelectorAll(
  '.shop-product[data-name="Лев"] .shop-slider-dot'
);

lionSlider.addEventListener('scroll', () => {

  const slideWidth = lionSlider.clientWidth;

  const currentSlide = Math.round(
    lionSlider.scrollLeft / slideWidth
  );

  lionDots.forEach((dot, index) => {

    dot.classList.toggle(
      'is-active',
      index === currentSlide
    );

  });

});
